<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Schlauchmanagement-App v0.0.1</title>
    
    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#f8f9fa">
    
    <!-- Tailwind CSS (für schnelles, sauberes Excel-nahes UI-Design) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* Excel-nahes, schlichtes Design ("Weniger ist mehr") */
        body {
            background-color: #f3f4f6;
            color: #1f2937;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .excel-table th {
            background-color: #e5e7eb;
            border-bottom: 2px solid #d1d5db;
        }
        .excel-table td, .excel-table th {
            border: 1px solid #e5e7eb;
            padding: 8px 12px;
            font-size: 0.875rem;
        }
        /* Sticky Header für Tabellenansicht */
        .sticky-header {
            position: sticky;
            top: 0;
            z-index: 10;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Hard Lock Login / Benutzer-Eingangssperre (Overlay) -->
    <div id="user-lock-modal" class="fixed inset-0 bg-gray-900 bg-opacity-75 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-md w-full p-6">
            <h2 class="text-lg font-semibold mb-4 text-gray-800">Anmeldung erforderlich</h2>
            <p class="text-sm text-gray-600 mb-4">Bitte wählen Sie Ihren Benutzer aus, um fortzufahren:</p>
            <select id="user-select" class="w-full border border-gray-300 rounded p-2 mb-4 text-sm focus:ring-2 focus:ring-blue-500">
                <-- Wird dynamisch via users.json gefüllt -->
                <option value="">Lade Benutzer...</option>
            </select>
            <button id="user-login-btn" class="w-full bg-blue-600 text-white py-2 rounded font-medium hover:bg-blue-700 transition">
                App entsperren
            </button>
        </div>
    </div>

    <!-- App Header (Sticky) -->
    <header class="bg-white border-b border-gray-200 px-4 py-3 sticky top-0 z-20 flex justify-between items-center shadow-sm">
        <div class="flex items-center space-x-3">
            <span class="font-bold text-gray-800">Schlauch-App</span>
            <span id="active-user-badge" class="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded border border-gray-300"></span>
        </div>
        <div class="flex items-center space-x-2">
            <button id="btn-voice-command" class="bg-red-600 text-white px-3 py-1.5 rounded text-sm font-medium hover:bg-red-700 shadow-sm flex items-center space-x-1">
                <span>🎙️ Diktieren</span>
            </button>
        </div>
    </header>

    <!-- Hauptbereich (Responsive: Mobile Karten / Desktop Tabellen) -->
    <main class="flex-1 p-4 max-w-7xl mx-auto w-full">
        
        <!-- Toolbar / Dateipool Schnellzugriff -->
        <div class="mb-4 flex flex-wrap justify-between items-center gap-2">
            <div class="flex items-center space-x-2">
                <label class="bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 px-3 py-1.5 rounded text-sm font-medium cursor-pointer shadow-sm">
                    📁 Excel importieren (.xlsx/.xls)
                    <input type="file" id="excel-file-input" accept=".xlsx, .xls" class="hidden">
                </label>
                <span id="active-file-name" class="text-xs text-gray-500 italic">Keine Datei aktiv</span>
            </div>
            <div class="flex items-center space-x-2">
                <button id="btn-export-master" class="bg-emerald-600 text-white px-3 py-1.5 rounded text-sm font-medium hover:bg-emerald-700 shadow-sm">
                    💾 Master-Export
                </button>
            </div>
        </div>

        <!-- Ansichts-Container (Wird per JS je nach Bildschirmgröße geschaltet) -->
        <div id="app-content-container" class="bg-white rounded-lg shadow border border-gray-200 overflow-hidden">
            <!-- Platzhalter für dynamische Datensätze -->
            <div class="p-8 text-center text-gray-500 text-sm">
                Bitte importieren Sie eine Excel-Datei oder wählen Sie eine Datei aus dem Pool, um die Daten anzuzeigen.
            </div>
        </div>

    </main>

    <!-- iOS-Stil Aktions-Overlay (Versteckt) -->
    <div id="action-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full sm:max-w-lg rounded-t-2xl sm:rounded-lg p-6 shadow-2xl">
            <h3 id="overlay-title" class="text-base font-semibold text-gray-900 mb-2">Aktion wählen</h3>
            <p id="overlay-subtitle" class="text-xs text-gray-500 mb-4"></p>
            <div id="overlay-actions" class="space-y-2">
                <!-- Dynamische Buttons -->
            </div>
            <button id="overlay-close" class="mt-4 w-full bg-gray-100 text-gray-800 py-2 rounded text-sm font-medium hover:bg-gray-200">
                Abbrechen
            </button>
        </div>
    </div>

    <!-- Modulares JavaScript einbinden -->
    <script type="module" src="./js/app.js"></script>
</body>
</html>
