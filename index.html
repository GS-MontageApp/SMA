<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schlauchmanagement PWA</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- Header / Navigation -->
        <header class="app-header">
            <h1>Schlauchmanagement</h1>
            <div id="user-display" class="user-badge">Nicht angemeldet</div>
        </header>

        <!-- Main Content Area -->
        <main class="app-container">
            <section id="auth-section" class="card">
                <h2>Anmeldung</h2>
                <p>Bitte wählen Sie Ihren Benutzer aus:</p>
                <select id="user-select">
                    <-- Dynamisch gefüllt aus users.json -->
                </select>
                <button id="login-btn" class="btn primary">Anmelden</button>
            </section>

            <section id="dashboard-section" class="card" style="display: none;">
                <h2>Zentrale Dateipool & Dokumenten-Zentrale</h2>
                <div class="upload-container">
                    <input type="file" id="excel-upload" accept=".xlsx, .xls">
                    <label for="excel-upload" class="btn">Excel-Datei importieren</label>
                </div>
                <div id="file-pool-list" class="file-pool">
                    <!-- Liste der importierten Dateien -->
                </div>
            </section>
        </main>
    </div>

    <!-- Skripte -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="js/parser.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui-pool.js"></script>
    <script src="js/app-core.js"></script>
</body>
</html>
