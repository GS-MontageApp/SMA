<!DOCTYPE html>
<html lang="de" class="h-full bg-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Schlauchmanagement-App</title>
    
    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Schlauch-App">
    <link rel="manifest" href="./manifest.json">
    
    <!-- Tailwind CSS (CDN für schlanke, performante Auslieferung im Offline-Modus vorbereitbar) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        excel: {
                            header: '#f8f9fa',
                            border: '#d1d5db',
                            grid: '#e5e7eb',
                            accent: '#0f766e'
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Excel-nahe Tabellenoptik & Custom Scrollbars */
        .excel-table th, .excel-table td {
            border-color: #d1d5db;
        }
        body {
            -webkit-user-select: none;
            user-select: none;
        }
    </style>
</head>
<body class="h-full flex flex-col text-slate-800 antialiased">

    <!-- Harte Eingangssperre / Benutzer-Authentifizierungs-Overlay (Admin-Commit-Prinzip) -->
    <div id="auth-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md p-6 border border-slate-200">
            <h2 class="text-lg font-semibold text-slate-900 mb-2">Benutzer-Anmeldung</h2>
            <p class="text-sm text-slate-600 mb-4">Bitte wählen Sie Ihren Namen für die Nachvollziehbarkeit in den Exporten aus:</p>
            <select id="user-select" class="w-full border border-slate-300 rounded p-2.5 text-sm bg-white mb-4 focus:ring-2 focus:ring-teal-600 focus:outline-none">
                <option value="">-- Benutzer auswählen --</option>
                <!-- Wird dynamisch aus users.json befüllt -->
            </select>
            <button id="auth-submit-btn" onclick="appLogin()" class="w-full bg-teal-700 hover:bg-teal-800 text-white font-medium py-2.5 rounded text-sm transition-colors">
                Anwendung starten
            </button>
        </div>
    </div>

    <!-- App-Header / Sticky Header -->
    <header class="bg-white border-b border-excel-border px-4 py-3 flex items-center justify-between shadow-sm shrink-0">
        <div class="flex items-center space-x-3">
            <div class="bg-teal-700 text-white p-2 rounded font-bold text-xs tracking-wider">PWA</div>
            <div>
                <h1 class="text-base font-semibold leading-tight">Schlauchmanagement</h1>
                <p class="text-xs text-slate-500" id="current-user-display">Nicht angemeldet</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="openVoiceAssistant()" class="bg-slate-100 hover:bg-slate-200 border border-slate-300 text-slate-700 px-3 py-1.5 rounded text-xs font-medium flex items-center space-x-1">
                <span>🎤 Diktat</span>
            </button>
            <button onclick="openDataPool()" class="bg-teal-700 hover:bg-teal-800 text-white px-3 py-1.5 rounded text-xs font-medium">
                Dokumenten-Zentrale
            </button>
        </div>
    </header>

    <!-- Hauptarbeitsbereich (Responsive: Kartenlayout auf Mobilgeräten, Tabellenansicht auf Desktop) -->
    <main class="flex-1 overflow-hidden flex flex-col p-2 md:p-4">
        <div class="flex-1 bg-white border border-excel-border rounded-lg shadow-sm overflow-hidden flex flex-col">
            
            <!-- Toolbar / Schnellwechsler -->
            <div class="bg-excel-header border-b border-excel-border p-2.5 flex items-center justify-between text-xs text-slate-600">
                <span id="active-file-label">Keine Datei geladen</span>
                <div class="flex space-x-2">
                    <span id="record-count-badge" class="bg-slate-200 px-2 py-0.5 rounded font-mono">0 Datensätze</span>
                </div>
            </div>

            <!-- Datenbereich (Scrollbar) -->
            <div class="flex-1 overflow-auto p-4" id="main-content-viewport">
                <div class="flex flex-col items-center justify-center h-full text-center text-slate-400">
                    <p class="text-sm">Bitte öffnen Sie die Dokumenten-Zentrale und wählen Sie eine Datei aus dem Pool.</p>
                </div>
            </div>

        </div>
    </main>

    <!-- App-Logik (Modulare Einbindung) -->
    <script>
        function appLogin() {
            const select = document.getElementById('user-select');
            if (!select.value) {
                alert('Bitte wählen Sie einen gültigen Benutzer aus.');
                return;
            }
            document.getElementById('current-user-display').innerText = 'Bearbeiter: ' + select.value;
            document.getElementById('auth-modal').style.display = 'none';
        }

        function openVoiceAssistant() {
            alert('Voice-to-Excel Assistant wird geöffnet...');
        }

        function openDataPool() {
            alert('Dokumenten-Zentrale wird geöffnet...');
        }

        // Dummy-Initialisierung für User-Auswahl beim Start
        window.addEventListener('DOMContentLoaded', () => {
            const users = ['Max Mustermann', 'Anna Schmidt', 'Technik Team West'];
            const select = document.getElementById('user-select');
            users.forEach(u => {
                const opt = document.createElement('option');
                opt.value = u;
                opt.textContent = u;
                select.appendChild(opt);
            });
        });
    </script>
</body>
</html>
