<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Schlauchmanagement-App (PWA)</title>
    
    <!-- PWA Manifest & Meta -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f4f5f7">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- App-Header (Sticky) -->
    <header id="app-header">
        <div class="header-left">
            <span id="app-title">Schlauchmanagement</span>
            <span id="user-badge" class="badge">Gast</span>
        </div>
        <div class="header-right">
            <button id="btn-voice" class="icon-btn" title="Voice-to-Excel">🎤</button>
            <button id="btn-pool" class="icon-btn" title="Dokumenten-Zentrale">📁</button>
            <button id="btn-menu" class="icon-btn" title="Menü">☰</button>
        </div>
    </header>

    <!-- Hauptbühne / Arbeitsumgebung -->
    <main id="app-stage">
        
        <!-- Login- / Eingangssperre (Admin-Commit-Prinzip via users.json) -->
        <section id="view-login" class="app-view active">
            <div class="card login-card">
                <h2>Benutzer-Anmeldung</h2>
                <p>Bitte wählen Sie Ihren Namen für die Nachvollziehbarkeit:</p>
                <select id="select-user" class="form-control">
                    <option value="">-- Benutzer wählen --</option>
                    <!-- Dynamisch gefüllt aus users.json -->
                </select>
                <button id="btn-login-submit" class="btn primary">App entsperren</button>
            </div>
        </section>

        <!-- Hauptansicht: Schlauchkataster / Datentabelle -->
        <section id="view-dashboard" class="app-view">
            <div class="toolbar">
                <input type="text" id="search-input" class="form-control" placeholder="Schlauch-ID, Typ oder Anschluss suchen...">
                <button id="btn-new-hose" class="btn">+ Neuer Schlauch</button>
            </div>

            <!-- Responsive Container: Mobile Karten vs. Desktop Tabelle -->
            <div class="table-container">
                <table id="hose-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Typ</th>
                            <th>Länge (m)</th>
                            <th>DN / Größe</th>
                            <th>Betriebsdruck</th>
                            <th>Status</th>
                            <th>Aktionen</th>
                        </tr>
                    </thead>
                    <tbody id="hose-table-body">
                        <!-- Dynamische Zeilen -->
                    </tbody>
                </table>
            </div>

            <!-- Mobile Card-Anker Ansicht (wird per CSS auf Smartphones eingeblendet) -->
            <div id="mobile-card-list" class="card-list">
                <!-- Dynamische p-5 Card-Anker -->
            </div>
        </section>

    </main>

    <!-- iOS-Stil Overlay / Modals -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Titel</h3>
                <button id="modal-close" class="icon-btn">✕</button>
            </div>
            <div id="modal-body">
                <!-- Dynamischer Inhalt -->
            </div>
        </div>
    </div>

    <!-- JavaScript Module -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
