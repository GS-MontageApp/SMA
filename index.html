<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schlauchmanagement</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <h1>Schlauchmanagement</h1>
            <div id="user-display" class="user-badge">-</div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Login View -->
            <section id="login-view" class="view active">
                <div class="card">
                    <h2>Anmeldung</h2>
                    <p>Bitte wählen Sie Ihren Benutzer aus:</p>
                    <div class="form-group">
                        <select id="user-select" class="form-control">
                            <option value="">-- Benutzer auswählen --</option>
                        </select>
                    </div>
                    <button id="login-btn" class="btn btn-primary" disabled>Anmelden</button>
                </div>
            </section>

            <!-- Dashboard View -->
            <section id="dashboard-view" class="view" style="display: none;">
                <div class="card">
                    <div class="card-header">
                        <h2>Zentrale Dateipool & Dokumenten-Zentrale</h2>
                        <button id="logout-btn" class="btn btn-secondary btn-sm">Abmelden</button>
                    </div>
                    
                    <!-- Upload Section (Strikter Read-Only Originalschutz & Limit 600 KB) -->
                    <div class="upload-section">
                        <input type="file" id="excel-file-input" accept=".xlsx, .xls" style="display: none;">
                        <button id="upload-trigger-btn" class="btn btn-primary">Excel-Datei importieren</button>
                        <p class="hint">Unterstützt .xlsx und .xls (Max. 600 KB | Strikte Validierung auf 'Tabelle1')</p>
                    </div>

                    <!-- File Pool List -->
                    <div class="file-pool-container">
                        <h3>Importierte Dateien</h3>
                        <div id="file-pool-list" class="file-list">
                            <p class="empty-state">Keine Dateien im Pool vorhanden.</p>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/parser.js"></script>
    <script src="js/ui-pool.js"></script>
    <script src="js/app-core.js"></script>
</body>
</html>
